[package]
name = "monoxus-core"
version = "0.1.2"
edition = "2024"
description = "Pure Rust headless UI state machines, relationships, attribute publishers, and overlay geometry for Monoxus."
license = "MIT"
repository = "https://github.com/techton7/monoxus"

[features]
default = ["serde"]
serde = ["dep:serde", "ui-sdk/serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
ui-sdk = { version = "0.1.0", default-features = false, features = ["std", "full"] }
