[[scenarios]]
name = "collapsible-closed"
description = "Verify initial closed state of collapsible component in playground"
viewports = ["desktop"]

[[scenarios.actions]]
kind = "click"
target = "#nav-link-collapsible"

[[scenarios.targets]]
id = "collapsible-trigger"
selector = "#collapsible-trigger"
part = "trigger"
state = "closed"

[[scenarios]]
name = "collapsible-sw2b-open"
description = "Verify open state and measured dimensions of SW2B animated collapsible"
viewports = ["desktop"]

[[scenarios.actions]]
kind = "click"
target = "#nav-link-collapsible"

[[scenarios.actions]]
kind = "click"
target = "#sw2b-collapsible-trigger"

[[scenarios.targets]]
id = "sw2b-collapsible-content"
selector = "#sw2b-collapsible-content"
part = "content"
state = "open"
