part = "content"
state = "open"

[[scenarios.targets]]
id = "sw5c-dp-main-calendar"
selector = "#sw5c-dp-main-calendar"
part = "calendar"
state = "open"

[[scenarios.targets]]
id = "sw5c-dp-main-day-2024-06-15"
selector = "#sw5c-dp-main-day-2024-06-15"
part = "day"
state = "selected"

[[scenarios]]
name = "date-picker-select-day-and-close"
