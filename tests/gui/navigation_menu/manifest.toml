[[scenarios]]
name = "navigation-menu-escape-dismiss"
description = "Verify Escape dismisses open NavigationMenuContent and closes trigger"
viewports = ["desktop"]

[[scenarios.actions]]
kind = "click"
target = "#nav-link-navigation-menu"

[[scenarios.actions]]
kind = "click"
target = "#sw3c-nm-trig-overview"

[[scenarios.actions]]
kind = "wait"
ms = 50

[[scenarios.actions]]
kind = "key"
key = "Escape"

[[scenarios.actions]]
kind = "wait"
ms = 50

[[scenarios.targets]]
id = "sw3c-nm-trig-overview"
selector = "#sw3c-nm-trig-overview"
part = "trigger"
state = "closed"
