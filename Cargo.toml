[package]
name = "monoxus"
version = "0.1.0"
edition = "2024"
description = "Headless Dioxus primitives and shared foundations for accessible, composable component systems."
readme = "README.md"
license = "MIT"
repository = "https://github.com/techton7/monoxus"
exclude = ["tests/gui/**"]
autotests = false

[dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["devtools", "document", "hooks", "html", "mounted", "signals", "macro", "asset"] }
# Upstream FFI / host abstraction engine.
# Note: Keep tagged GitHub release here matching kinetoxus until crates.io publication.
# For local development against ../../util/oxidase, use workspace/local patch config.
# Do NOT reintroduce inline `path = "..."` here as it breaks downstream packaging and CI.
oxidase = { version = "0.4.2", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.4.2" }
oxidase-floating-ui = { version = "0.4.2", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.4.2" }
serde = { version = "1.0", features = ["derive"] }
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
default = []
native = ["oxidase/native"]
manganis-embedded = []

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "standalone_asset_test"
path = "tests/standalone_asset_test.rs"
required-features = ["manganis-embedded"]

[dev-dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["minimal"] }
serde_json = "1.0"
manganis = "0.8.0-alpha.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blitz-host = { version = "0.3.2", git = "https://github.com/techton7/blitz-host.git", tag = "blitz-host-v0.3.2", features = ["dioxus-native"] }
blitz-dom = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.5" }
blitz-test-harness = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.5" }
dioxus-native-dom = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.5" }
oxidase = { version = "0.4.2", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.4.2", features = ["native"] }
dioxus-native = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.5" }
blitz-traits = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.5" }
keyboard-types = "0.8"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false


