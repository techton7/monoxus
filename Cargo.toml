[package]
name = "monoxus"
version = "0.1.0"
edition = "2024"
description = "Headless Dioxus primitives and shared foundations for accessible, composable component systems."
readme = "README.md"
license = "MIT"
repository = "https://github.com/techton7/monoxus"
exclude = ["tests/gui/**"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["devtools", "document", "hooks", "html", "mounted", "signals", "macro", "asset"] }
# Upstream FFI / host abstraction engine.
# Note: Keep tagged GitHub release here matching kinetoxus until crates.io publication.
# For local development against ../../util/oxidase, use workspace/local patch config.
# Do NOT reintroduce inline `path = "..."` here as it breaks downstream packaging and CI.
oxidase = { version = "0.1.11", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.11" }
oxidase-floating-ui = { version = "0.1.11", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.11" }
serde = { version = "1.0", features = ["derive"] }
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
js-sys = "0.3"

[features]
default = []
native = ["oxidase/native"]

[[test]]
name = "native_overlay_test"
required-features = ["native"]

[[test]]
name = "native_data_gesture_test"
required-features = ["native"]

[[test]]
name = "native_presence_exit_test"
required-features = ["native"]

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
blitz-dom = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.4" }
blitz-test-harness = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.4" }
dioxus-native-dom = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.4" }
oxidase = { version = "0.1.11", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.11", features = ["native"] }
dioxus-native = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.4" }
blitz-traits = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.4" }
keyboard-types = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "Node",
    "CssStyleDeclaration",
    "DomRect",
    "PointerEvent",
    "EventTarget",
] }
wasm-bindgen = "0.2"

[profile.dev.package."*"]
opt-level = 3


