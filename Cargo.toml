[package]
name = "monoxus"
version = "0.1.0"
edition = "2024"
description = "Headless Dioxus primitives and shared foundations for accessible, composable component systems."
readme = "README.md"
license = "MIT"
repository = "https://github.com/techton7/monoxus"

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["devtools", "document", "hooks", "html", "mounted", "signals", "macro", "asset"] }
# Upstream FFI engine.
# Note: Keep pure crates.io version here. For local development against ../../util/dioxus_js_bindgen,
# use local .cargo/config.toml ([patch.crates-io]). Do NOT add inline `path = "..."` here as it breaks CI / release-plz packaging.
dioxus-js-interop = { path = "../../util/dioxus_js_interop/crates/dioxus-js-interop" }
serde = { version = "1.0", features = ["derive"] }
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
js-sys = "0.3"

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }
serde_json = "1.0"
